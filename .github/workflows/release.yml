name: Build Release Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0beta1)'
        required: true
        default: 'test'

permissions:
  contents: write

env:
  APP_NAME: fcp-support
  APP_VERSION: ${{ github.event.release.tag_name || github.event.inputs.version }}

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install git for checkout
        run: dnf install -y git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build dependencies
        run: |
          dnf install -y rpm-build make gcc \
            alsa-lib-devel openssl-devel zlib-devel json-c-devel \
            systemd-devel systemd-rpm-macros

      - name: Build RPM
        run: make rpm VERSION=${{ env.APP_VERSION }}

      # rpmbuild names the file after the package version, which gains a
      # tilde for a pre-release tag. The asset keeps the tag.
      - name: Find and rename RPM
        id: find-rpm
        run: |
          src=$(find ~/rpmbuild/RPMS -name '*.rpm' -not -name '*debug*' | head -1)
          dst=${{ env.APP_NAME }}-${{ env.APP_VERSION }}.x86_64.rpm
          cp "$src" "$dst"
          echo "rpm_path=$dst" >> $GITHUB_OUTPUT

      - name: Upload RPM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-package
          path: ${{ steps.find-rpm.outputs.rpm_path }}

      - name: Upload RPM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-rpm.outputs.rpm_path }}

  build-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc \
            libasound2-dev libssl-dev zlib1g-dev libjson-c-dev libsystemd-dev

      - name: Build deb
        run: make deb VERSION=${{ env.APP_VERSION }}

      - name: Find deb
        id: find-deb
        run: echo "deb_path=$(ls ${{ env.APP_NAME }}_*.deb | head -1)" >> $GITHUB_OUTPUT

      - name: Upload deb as artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: ${{ steps.find-deb.outputs.deb_path }}

      - name: Upload deb to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-deb.outputs.deb_path }}
